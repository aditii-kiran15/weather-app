
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="weather-app">

        <header class="header">
            <p class="tagline">WEATHER FORECAST</p>
            <h1>Weather App</h1>
            <p class="subtitle">Discover the weather in your city.</p>
        </header>

        <form id="weatherForm" class="search-box">
            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name..."
                aria-label="City name"
                required
            >

            <button type="submit" id="searchBtn">
                Search
            </button>
        </form>

        <p id="message" class="message" role="status">
            Enter a city name to check its weather.
        </p>

        <section id="weatherCard" class="weather-card" hidden>

            <div class="weather-top">
                <div>
                    <p class="small-label">CURRENT WEATHER</p>
                    <h2 id="cityName">City Name</h2>
                    <p id="weatherCondition">Weather condition</p>
                </div>

                <img id="weatherIcon" src="" alt="Weather icon">
            </div>

            <div class="temperature">
                <span id="temperature">--</span><span class="degree">°C</span>
            </div>

            <div class="weather-details">

                <div class="detail">
                    <span class="detail-icon">💧</span>
                    <div>
                        <p class="detail-label">Humidity</p>
                        <p class="detail-value" id="humidity">--%</p>
                    </div>
                </div>

                <div class="detail">
                    <span class="detail-icon">🌡️</span>
                    <div>
                        <p class="detail-label">Feels Like</p>
                        <p class="detail-value" id="feelsLike">--°C</p>
                    </div>
                </div>

            </div>

        </section>

        <footer>
            <p>Made with care ☁️</p>
        </footer>

    </main>

</body>
</html>
